version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: monitor
build:
  toolchains: []
  run_buildscript: false
images:
  - id: monitor
    target: service
    service: monitor
    source: docker.io/stqfdyr/monitor
    channel: stable
    sort: semver
    tag_regex: ^[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    skip_if_version_exists: true
    name: monitor
    summary: 轻量级服务器探针中心
